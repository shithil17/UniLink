<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f5" />
    <script>
      // No-flash theme: runs before first paint. Keep the key, ids and bar colors in step with
      // src/shared/themes.ts (themes.test.ts checks this). Unknown or unreadable value = ocean.
      (function () {
        var bars = {
          ocean: "#f4f6f5",
          "red-gradient": "#f7f3f3",
          "cherry-blossom": "#fbf4f5",
          "cherry-red": "#f3f4f4",
        };
        var id = "ocean";
        try {
          var saved = localStorage.getItem("unilink-theme");
          if (saved && Object.prototype.hasOwnProperty.call(bars, saved)) id = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = id;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", bars[id]);
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta
      name="description"
      content="An unofficial, student-run companion for NSU students: your course map and degree progress in one app."
    />
    <title>UniLink</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
